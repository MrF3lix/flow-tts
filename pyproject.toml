[project]
name = "test-tts"
version = "0.1.0"
description = "Latent Energy Matching for mel-spectrogram TTS on a dialect continuum (test implementation)"
readme = "README.md"
authors = [
    { name = "Felix Saaro", email = "saaf@zhaw.ch" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.8.0,<2.12",
    "torchaudio>=2.8.0,<2.12",
    "numpy>=2.0",
    "soundfile",             # audio I/O without an FFmpeg dependency
    "transformers>=4.57,<5", # Whisper mel filterbank + the VocBulwark vocoder / speaker encoder (remote code)
    # --------- hydra --------- #
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "omegaconf>=2.3",
    "rootutils",             # project root / PROJECT_ROOT env var, as in Matcha-TTS
    # --------- others --------- #
    "tensorboard",
    "matplotlib",
    "rich",
    "tqdm",
    "numba>=0.68.0",
    "num2words>=0.5.14",
]

[project.optional-dependencies]
cu128 = ["torch==2.8.0", "torchaudio==2.8.0"]
rocm = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "triton-rocm; platform_machine == 'x86_64' and sys_platform == 'linux'",
]
wandb = ["wandb"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "nbformat>=5.11.1",
    "notebook>=7.6.3",
    "pytest>=8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchaudio = [
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-rocm", extra = "rocm" },
]

triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "rocm" }]]

[project.scripts]
tts-build-filelist = "test_tts.cli.build_filelist:main"
tts-data-stats = "test_tts.cli.data_stats:main"
tts-speaker-embedding = "test_tts.cli.speaker_embedding:main"
tts-train-vae = "test_tts.train_vae:main"
tts-vae-reconstruct = "test_tts.cli.vae_reconstruct:main"
tts-vae-latent-stats = "test_tts.cli.vae_latent_stats:main"
tts-vocode = "test_tts.cli.vocode:main"
tts-train-fm = "test_tts.train_fm:main"
tts-synthesize = "test_tts.cli.synthesize:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
